interface:
  display_name: "KOLSprite TikTok 数据搜索"
  short_description: "查询并筛选 TikTok 达人、商品、视频和店铺的当前数据"
  default_prompt: "使用 $kolsprite-search 查询并筛选这批 TikTok 达人、商品、视频或店铺数据。"

dependencies:
  tools:
    - type: "mcp"
      value: "kolsprite"
      description: "KOLSprite unified TikTok data and caption MCP"
      transport: "streamable_http"
      url: "https://mcp.kolsprite.com/mcp"

policy:
  allow_implicit_invocation: true
