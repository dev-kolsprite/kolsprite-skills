interface:
  display_name: "KOLSprite TikTok 字幕分析"
  short_description: "提取并分析 TikTok 视频字幕、口播、Hook、卖点和 CTA"
  default_prompt: "使用 $kolsprite-caption 提取这个 TikTok 视频的字幕并分析 Hook、卖点和 CTA。"

dependencies:
  tools:
    - type: "mcp"
      value: "kolsprite"
      description: "KOLSprite unified TikTok data and caption MCP"
      transport: "streamable_http"
      url: "https://mcp.kolsprite.com/mcp"

policy:
  allow_implicit_invocation: true
