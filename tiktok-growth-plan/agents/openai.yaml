  short_description: "把公开账号能力与目标类目机会组合成可执行的 30 天增长计划"
  default_prompt: "使用 $tiktok-growth-plan 分析我的公开 TikTok 账号与目标类目，并制定 30 天增长计划。"

dependencies:
  tools:
    - type: "mcp"
      value: "kolsprite"
      description: "KOLSprite unified TikTok data and caption MCP"
      transport: "streamable_http"
      url: "https://mcp.kolsprite.com/mcp"

policy:
  allow_implicit_invocation: true
