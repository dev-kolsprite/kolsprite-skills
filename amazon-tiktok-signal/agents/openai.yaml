interface:
  display_name: "达人精灵·Amazon商品TikTok热度分析"
  short_description: "分析Amazon ASIN同款与相似商品的TikTok热度、月度变化和商业信号"
  default_prompt: "使用 $amazon-tiktok-signal 分析这个 ASIN 的 TikTok 站外热度，并粗略判断最近一个月相较上个月的变化。"

dependencies:
  tools:
    - type: "mcp"
      value: "yunyamcp"
      description: "SellerSpace Yunya unified MCP with KOLSprite TikTok and ASIN tools"
      transport: "streamable_http"
      url: "https://www.sellerspace.com/yunya_mcp/"

policy:
  allow_implicit_invocation: true
